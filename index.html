<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Habits</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --ink:#2b2d2a; --soft:#6f736c; --line:#e6e2d8;
  --accent:#6f8f72; --accent-soft:#e3ebe1; --warm:#c58b5c; --warm-soft:#f4e6da;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1d1b; --card:#242724; --ink:#e9e8e3; --soft:#a3a69f; --line:#343833;
    --accent:#93b496; --accent-soft:#2d3a2e; --warm:#d9a77d; --warm-soft:#3d3128; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-weight:600;font-size:26px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:26px 0 10px}
.sub{color:var(--soft);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:0 0 10px}
.habit{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;transition:.2s;margin-top:2px}
.tick svg{opacity:0;transition:.2s}
.tick.done{background:var(--accent);border-color:var(--accent)}
.tick.done svg{opacity:1}
.hbody{flex:1;min-width:0}
.hname{font-weight:600;margin:0}
.tiny{color:var(--soft);font-size:14px;margin:2px 0 0}
.cue{font-size:13px;color:var(--soft);margin:6px 0 0;font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:0;cursor:pointer;font-family:inherit}
.pill.warm{background:var(--warm-soft)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
.dots{display:flex;gap:5px;margin-top:10px}
.dot{width:22px;text-align:center;font-size:10px;color:var(--soft)}
.dot i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 3px;background:var(--line)}
.dot.off i{background:transparent;border:1px dashed var(--line)}
.dot.done i{background:var(--accent)}
.dot.today{color:var(--ink);font-weight:600}
.nudge{font-size:13px;color:var(--warm);margin:6px 0 0}
.empty{color:var(--soft);text-align:center;padding:24px 8px}
button.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer;width:100%;font-weight:600}
button.btn.secondary{background:var(--accent-soft);color:var(--ink)}
button.link{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0}
label{display:block;font-size:13px;color:var(--soft);margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.days{display:flex;gap:6px}
.days button{flex:1;font:inherit;font-size:13px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font:inherit;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 18px;cursor:pointer}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea p{margin:0;flex:1}
.x{background:none;border:0;color:var(--soft);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet-inner{max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hint{font-size:13px;color:var(--soft)}
.quote{font-size:14px;color:var(--soft);font-style:italic;margin:4px 0 0}
.grow{background:var(--warm-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<main id="app"></main>

<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Today</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Habits</button>
  <button data-tab="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const KEY = 'little-habits-v1';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const ICS_DAYS = ['MO','TU','WE','TH','FR','SA','SU'];
const AREAS = ['Studio','Home','Health','Life'];
const SIZES = [{id:'5',label:'5 min'},{id:'30',label:'~30 min'},{id:'big',label:'Bigger project'}];

function uid(){ return Math.random().toString(36).slice(2,10); }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.habits) return s; } catch(e){}
  return {
    habits:[{
      id:uid(), name:'Go to the studio', tiny:'Just arrive and open one sketchbook',
      cue:'After I finish work, I grab my bag and go', days:[1,5], time:'17:30', mins:20,
      area:'Studio', identity:'someone who makes art', done:{}, created:todayKey()
    }],
    ideas:[]
  };
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return keyOf(new Date()); }
function dow(d){ return (d.getDay()+6)%7; } // Mon=0
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function scheduled(h,d){ return h.days.includes(dow(d)); }

/* Forgiving streak: walk back through scheduled days.
   One miss is forgiven ("never miss twice"); two misses in a row end the run. */
function streak(h){
  let count=0, misses=0, d=new Date();
  const start = h.created ? new Date(h.created+'T00:00') : addDays(d,-365);
  // today only counts against you once it's over
  if (scheduled(h,d) && !h.done[keyOf(d)]) d=addDays(d,-1);
  for(let i=0;i<400 && d>=start;i++, d=addDays(d,-1)){
    if(!scheduled(h,d)) continue;
    if(h.done[keyOf(d)]){ count++; misses=0; }
    else { misses++; if(misses>=2) break; }
  }
  return count;
}
function missedLast(h){
  let d=addDays(new Date(),-1);
  const start = h.created ? new Date(h.created+'T00:00') : d;
  for(let i=0;i<14 && d>=start;i++, d=addDays(d,-1)){
    if(scheduled(h,d)) return !h.done[keyOf(d)];
  }
  return false;
}
function doneInLastWeeks(h,weeks){
  let n=0,need=0,d=new Date();
  for(let i=0;i<weeks*7;i++,d=addDays(d,-1)){ if(scheduled(h,d)){need++; if(h.done[keyOf(d)]) n++;} }
  return {n,need};
}

/* ---------- brain-dump sorter ---------- */
const AREA_WORDS = {
  Studio:/\b(art|studio|paint|painting|draw|drawing|sketch|clay|ceramic|pottery|print|canvas|photo|design|craft|sew|knit|make|create|music|guitar|piano|write|writing|poem)\w*/i,
  Home:/\b(clean|tidy|declutter|laundry|wash|dish|garden|plant|fix|repair|cook|meal|kitchen|room|house|home|shelf|cupboard|wardrobe|vacuum|bin|fridge|sort)\w*/i,
  Health:/\b(walk|run|gym|yoga|stretch|swim|bike|cycle|sleep|water|meditat|breath|exercise|workout|doctor|dentist|vitamin|eat|salad|veg|health|physio|pilates)\w*/i,
};
const BIG = /\b(project|build|learn|course|plan|redo|renovat|organi[sz]e (the|my) (whole|entire)|whole|entire|website|business|book|series|exhibition|portfolio|trip|move|apply)\w*/i;
const SMALL = /\b(text|call|email|message|reply|book|order|buy|pay|check|water the|drink|take out|put|bin|list|note|sign|send|cancel|renew|text)\w*/i;
const FOOD = /\b(milk|eggs?|bread|butter|cheese|yog(h)?urt|cream|flour|sugar|salt|pepper|oil|vinegar|rice|pasta|noodles?|oats|cereal|muesli|coffee|tea|juice|apples?|bananas?|oranges?|lemons?|limes?|berries|strawberr\w*|blueberr\w*|grapes|avocados?|kiwi\w*|tomato(es)?|potato(es)?|kumara|onions?|garlic|ginger|carrots?|broccoli|spinach|lettuce|cucumber|capsicum|peppers?|mushrooms?|courgette|zucchini|pumpkin|cabbage|celery|corn|peas|beans|lentils|chickpeas|tofu|chicken|beef|mince|pork|lamb|bacon|ham|sausages?|fish|salmon|tuna|prawns?|herbs?|basil|parsley|coriander|cumin|paprika|chocolate|biscuits?|crackers|chips|nuts|almonds|peanut butter|honey|jam|stock|soy sauce|sauce|tinned|canned|frozen|wraps|tortillas|bagels?|buns|toilet paper|loo roll|dish(washing)? liquid|detergent|soap|shampoo|toothpaste)\b/i;
function isShop(t){ return FOOD.test(t) && t.split(/\s+/).length<=5; }
function guessArea(t){ for(const a of ['Studio','Health','Home']) if(AREA_WORDS[a].test(t)) return a; return 'Life'; }
function guessSize(t){
  const m = t.match(/(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hour|hours)\b/i);
  if(m){ const mins = /^h/i.test(m[2]) ? +m[1]*60 : +m[1]; return mins<=10?'5':mins<=60?'30':'big'; }
  if(BIG.test(t)) return 'big';
  if(SMALL.test(t) || t.split(/\s+/).length<=3) return '5';
  return '30';
}

/* ---------- calendar (.ics) ---------- */
function pad(n){return String(n).padStart(2,'0');}
function nextStart(h){
  const [hh,mm]=(h.time||'09:00').split(':').map(Number);
  let d=new Date(); d.setHours(hh,mm,0,0);
  for(let i=0;i<8;i++){ if(h.days.includes(dow(d)) && d>new Date()) return d; d=addDays(d,1); }
  return d;
}
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsFor(h){
  const d=nextStart(h), mins=+h.mins||15, e=new Date(d.getTime()+mins*60000);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  const now=new Date(), stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
  const desc=[h.identity?('You are '+h.identity.replace(/^(i am|i'm|im)\s+/i,'')+'.'):'', h.tiny?('Tiny version: '+h.tiny):'', h.cue?('Cue: '+h.cue):'', 'Just show up. Two minutes counts. Never miss twice.'].filter(Boolean).join('\n');
  const days=h.days.slice().sort().map(i=>ICS_DAYS[i]).join(',');
  const alertBefore = +h.alert||0;
  return [
    'BEGIN:VEVENT','UID:'+h.id+'@little-habits','DTSTAMP:'+stamp,
    'DTSTART:'+f(d),'DTEND:'+f(e),
    'RRULE:FREQ=WEEKLY;BYDAY='+days,
    'SUMMARY:'+icsEsc(h.name),'DESCRIPTION:'+icsEsc(desc),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(alertText(h)),
    'TRIGGER:-PT'+alertBefore+'M','END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}
function alertText(h){
  const who = h.identity ? ' You\'re '+h.identity.replace(/^(i am|i'm|im)\s+/i,'')+'.' : '';
  return h.name + (h.tiny ? '. Just start small: '+h.tiny+'.' : '. Just start, even for two minutes.') + who;
}
function icsDoc(list){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Little Habits//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    ...list.map(icsFor),'END:VCALENDAR'].join('\r\n');
}
const isStandalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(s))); }
function addToCalendar(list){
  const ics = icsDoc(list);
  if (isStandalone()){
    // Home-screen apps on iPhone can't hand files to Calendar, so open this in Safari with the event baked in.
    const url = location.origin + location.pathname + '#cal=' + b64(ics);
    window.open(url, '_blank');
    return;
  }
  location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}
function handleCalLink(){
  const m = location.hash.match(/^#cal=(.+)$/);
  if(!m) return false;
  let ics; try{ ics = unb64(m[1]); }catch(e){ return false; }
  const names=[...ics.matchAll(/SUMMARY:(.*)/g)].map(x=>x[1].replace(/\\(.)/g,'$1'));
  document.getElementById('app').innerHTML = `
    <h1>Add to Calendar</h1>
    <p class="sub">${names.map(esc).join(', ')}</p>
    <div class="card"><p>Tap below, then <b>Add All</b>. Your iPhone will remind you at habit time, every week.</p>
    <button class="btn" id="go">Add to Calendar</button></div>
    <p class="hint">Afterwards you can close this tab and go back to the app.</p>`;
  document.querySelector('nav').style.display='none';
  document.getElementById('go').onclick=()=>{ location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics); };
  return true;
}

/* ---------- ui helpers ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }
function openSheet(html, onMount){
  document.getElementById('sheetInner').innerHTML=html;
  document.getElementById('sheetBg').style.display='block';
  requestAnimationFrame(()=>document.getElementById('sheet').classList.add('open'));
  onMount && onMount();
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); document.getElementById('sheetBg').style.display='none'; }
document.getElementById('sheetBg').onclick=closeSheet;
const CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const QUOTES=['Every action is a vote for the type of person you wish to become.','Make it so easy you can\'t say no.','Never miss twice.','Showing up is the habit. The rest follows.','Small and often beats big and rare.'];

const CHEERS=['Nice. That\'s a vote for who you\'re becoming.','You showed up. That\'s the whole trick.','Done is better than perfect.','Small steps, real progress.','Future you says thanks.','That counts. Every bit counts.','Look at you, keeping a promise to yourself.'];
function cheer(h){
  const s=streak(h);
  if(h.identity && Math.random()<.4) return 'That\'s what '+h.identity.replace(/^(i am|i'm|im)\s+/i,'')+' does.';
  if([3,5,10,20,30,50,100].includes(s)) return s+' in a row. Quietly brilliant.';
  return CHEERS[Math.floor(Math.random()*CHEERS.length)];
}
function encouragement(todays){
  const now=new Date(), k=todayKey();
  const left=todays.filter(h=>!h.done[k]);
  if(!todays.length) return 'A rest day. Rest is part of it.';
  if(!left.length) return 'All done for today. Be proud of that.';
  const missed=left.find(missedLast);
  if(missed) return 'Yesterday slipped? Totally normal. The tiny version of "'+missed.name+'" gets you back on track.';
  if(now.getHours()>=19) return 'Still time for a tiny version. Two minutes counts.';
  return QUOTES[now.getDate()%QUOTES.length];
}
let tab='today';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); scrollTo(0,0); });

function render(){ ({today:renderToday,habits:renderHabits,ideas:renderIdeas})[tab](); }

/* ---------- Today ---------- */
function weekDots(h){
  const t=new Date(), monday=addDays(t,-dow(t));
  return '<div class="dots">'+DAYS.map((n,i)=>{
    const d=addDays(monday,i), k=keyOf(d), sch=scheduled(h,d);
    const cls=[!sch?'off':'', h.done[k]?'done':'', k===todayKey()?'today':''].join(' ');
    return `<div class="dot ${cls}"><i></i>${n[0]}</div>`;
  }).join('')+'</div>';
}
function habitCard(h, showTick){
  const k=todayKey(), done=!!h.done[k], s=streak(h);
  const nudge = !done && scheduled(h,new Date()) && missedLast(h) ? '<p class="nudge">Missed last time — that\'s fine. Just don\'t miss twice. Do the tiny version.</p>' : '';
  return `<div class="card"><div class="habit">
    ${showTick?`<button class="tick ${done?'done':''}" data-tick="${h.id}" aria-label="Done">${CHECK}</button>`:''}
    <div class="hbody">
      <p class="hname">${esc(h.name)}</p>
      ${h.tiny?`<p class="tiny">Tiny version: ${esc(h.tiny)}</p>`:''}
      ${h.cue?`<p class="cue">${esc(h.cue)}</p>`:''}
      <div class="meta">
        ${h.time?`<span class="pill ghost">${esc(h.time)} · ${h.mins||15} min</span>`:''}
        ${s?`<span class="pill">${s} in a row</span>`:''}
        ${h.area?`<span class="pill warm">${esc(h.area)}</span>`:''}
      </div>
      ${nudge}
      ${weekDots(h)}
    </div></div></div>`;
}
function renderToday(){
  const now=new Date();
  const todays=S.habits.filter(h=>scheduled(h,now));
  const others=S.habits.filter(h=>!scheduled(h,now));
  const doneN=todays.filter(h=>h.done[todayKey()]).length;
  const hello = now.getHours()<12?'Good morning':now.getHours()<18?'Good afternoon':'Good evening';
  document.getElementById('app').innerHTML=`
    <h1>${hello}</h1>
    <p class="sub">${now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}${todays.length?` · ${doneN} of ${todays.length} done`:''}</p>
    <p class="quote">${esc(encouragement(todays))}</p>
    <h2>Today</h2>
    ${todays.length?todays.map(h=>habitCard(h,true)).join(''):'<div class="empty">Nothing planned today. Rest counts too.</div>'}
    ${others.length?`<h2>Not today (tick anyway if you did it)</h2>`+others.map(h=>habitCard(h,true)).join(''):''}
    ${!S.habits.length?'<button class="btn" onclick="editHabit()">Add your first habit</button>':''}
  `;
  bindTicks();
}
function bindTicks(){
  document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{
    const h=S.habits.find(x=>x.id===b.dataset.tick), k=todayKey();
    if(h.done[k]) delete h.done[k]; else { h.done[k]=1; if(navigator.vibrate) navigator.vibrate(10); toast(cheer(h)); }
    save(); render();
  });
}

/* ---------- Habits ---------- */
function renderHabits(){
  document.getElementById('app').innerHTML=`
    <h1>Habits</h1>
    <p class="sub">Start tiny. Grow once it feels easy.</p>
    <h2>Your habits</h2>
    ${S.habits.map(h=>{
      const {n,need}=doneInLastWeeks(h,3);
      const grow = need>=4 && n/need>=0.8 ? `<div class="grow">You've shown up ${n} of ${need} times in 3 weeks. Ready to add a day or a few minutes?</div>`:'';
      return `<div class="card"><div class="hbody">
        <p class="hname">${esc(h.name)}</p>
        <p class="tiny">${h.days.slice().sort().map(i=>DAYS[i]).join(', ')||'No days set'}${h.time?' · '+esc(h.time):''} · ${h.mins||15} min</p>
        ${h.cue?`<p class="cue">${esc(h.cue)}</p>`:''}
        ${grow}
        <div class="meta">
          <button class="pill" data-cal="${h.id}">＋ Add to Calendar</button>
          <button class="pill ghost" data-edit="${h.id}">Edit</button>
        </div></div></div>`;}).join('')||'<div class="empty">No habits yet.</div>'}
    <button class="btn" onclick="editHabit()">New habit</button>
    ${S.habits.length>1?'<p style="text-align:center"><button class="link" id="calAll">Add all habits to Calendar</button></p>':''}
    <h2>About reminders</h2>
    <p class="hint">"Add to Calendar" puts the habit in your iPhone Calendar as a repeating event with an alert, so your phone reminds you at habit time even when this app is closed. If you change a habit's time, add it again and delete the old one in Calendar.</p>
    <h2>Backup</h2>
    <p class="hint">Your habits live only on this phone. Save a backup now and then.</p>
    <div class="row"><button class="btn secondary" id="exp">Save backup</button><button class="btn secondary" id="imp">Restore</button></div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
  `;
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editHabit(b.dataset.edit));
  document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>addToCalendar([S.habits.find(h=>h.id===b.dataset.cal)]));
  const ca=document.getElementById('calAll'); if(ca) ca.onclick=()=>addToCalendar(S.habits.filter(h=>h.days.length));
  document.getElementById('exp').onclick=exportData;
  document.getElementById('imp').onclick=()=>document.getElementById('impFile').click();
  document.getElementById('impFile').onchange=importData;
}
function editHabit(id, preset){
  const h = id ? S.habits.find(x=>x.id===id) : Object.assign({id:uid(),name:'',tiny:'',cue:'',days:[],time:'',mins:15,alert:0,area:'',done:{},created:todayKey()}, preset||{});
  let days=h.days.slice();
  openSheet(`
    <h1 style="font-size:22px">${id?'Edit habit':'New habit'}</h1>
    <label>What's the habit?</label><input id="f_name" value="${esc(h.name)}" placeholder="e.g. Go to the studio">
    <label>Tiny version (2 minutes or less to start)</label><input id="f_tiny" value="${esc(h.tiny)}" placeholder="e.g. Just arrive and open a sketchbook">
    <label>Who does this make you? (optional)</label><input id="f_identity" value="${esc(h.identity||'')}" placeholder="e.g. someone who makes art">
    <label>Cue: when / after what?</label><input id="f_cue" value="${esc(h.cue)}" placeholder="e.g. After my morning coffee, I will…">
    <label>Which days?</label><div class="days" id="f_days">${DAYS.map((d,i)=>`<button type="button" data-d="${i}" class="${days.includes(i)?'on':''}">${d[0]}</button>`).join('')}</div>
    <div class="row">
      <div><label>Time</label><input id="f_time" type="time" value="${esc(h.time)}"></div>
      <div><label>Minutes</label><input id="f_mins" type="number" inputmode="numeric" min="1" value="${h.mins||15}"></div>
    </div>
    <div class="row">
      <div><label>Calendar alert</label><select id="f_alert">${[[0,'At habit time'],[5,'5 min before'],[10,'10 min before'],[30,'30 min before']].map(([v,l])=>`<option value="${v}" ${+h.alert===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label>Area (optional)</label><select id="f_area"><option value="">None</option>${AREAS.map(a=>`<option ${h.area===a?'selected':''}>${a}</option>`).join('')}</select></div>
    </div>
    <div style="height:18px"></div>
    <button class="btn" id="f_save">Save</button>
    ${id?'<p style="text-align:center"><button class="link" id="f_del" style="color:var(--warm)">Delete habit</button></p>':''}
  `, ()=>{
    document.querySelectorAll('#f_days button').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d; days=days.includes(d)?days.filter(x=>x!==d):[...days,d]; b.classList.toggle('on'); });
    document.getElementById('f_save').onclick=()=>{
      const name=document.getElementById('f_name').value.trim(); if(!name){ toast('Give it a name'); return; }
      Object.assign(h,{name, tiny:f('tiny'), identity:f('identity'), cue:f('cue'), days, time:f('time'), mins:+f('mins')||15, alert:+f('alert')||0, area:f('area')});
      if(!id) S.habits.push(h);
      save(); closeSheet(); render();
      toast(h.days.length&&h.time ? 'Saved. Tap "Add to Calendar" for a reminder.' : 'Saved.');
    };
    const del=document.getElementById('f_del');
    if(del) del.onclick=()=>{ if(confirm('Delete this habit and its history?')){ S.habits=S.habits.filter(x=>x.id!==id); save(); closeSheet(); render(); } };
  });
  function f(n){ return document.getElementById('f_'+n).value.trim(); }
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const file=new File([blob],'little-habits-backup.json',{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); }
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  file.text().then(t=>{ const d=JSON.parse(t); if(!d.habits) throw 0; if(confirm('Replace everything here with this backup?')){ S=d; S.ideas=S.ideas||[]; save(); render(); toast('Restored'); } })
    .catch(()=>toast('That file didn\'t look like a backup'));
}

/* ---------- Ideas (brain dump) ---------- */
function shopList(){
  const items=S.ideas.filter(i=>i.shop);
  if(!items.length) return '';
  const got=items.filter(i=>i.got).length;
  return `<h2>Shopping list · ${items.length-got} to get</h2><div class="card">`+
    items.map(i=>`<div class="idea" style="align-items:center">
      <button class="tick ${i.got?'done':''}" style="width:26px;height:26px;margin:0" data-got="${i.id}" aria-label="Got it">${CHECK}</button>
      <p style="${i.got?'text-decoration:line-through;color:var(--soft)':''}">${esc(i.text)}</p>
      <button class="pill ghost" data-notshop="${i.id}" title="Not shopping">not food</button>
      <button class="x" data-del="${i.id}" aria-label="Remove">×</button></div>`).join('')+
    `</div>${got?'<p style="text-align:center;margin:0 0 6px"><button class="link" id="clearGot">Clear ticked items</button></p>':''}`;
}
let ideaView='size';
function renderIdeas(){
  const groups = ideaView==='size' ? SIZES.map(s=>({key:s.id,label:s.label})) : AREAS.map(a=>({key:a,label:a}));
  const field = ideaView==='size'?'size':'area';
  document.getElementById('app').innerHTML=`
    <h1>Ideas</h1>
    <p class="sub">Empty your head. One idea per line. I'll sort them.</p>
    <textarea id="dump" placeholder="paint something small&#10;clean out the hall cupboard&#10;learn to throw on the wheel&#10;text Sam back"></textarea>
    <div style="height:10px"></div>
    <button class="btn" id="addIdeas">Sort these</button>
    <div class="meta" style="margin-top:20px">
      <span class="hint">Group by</span>
      <button class="pill ${ideaView==='size'?'':'ghost'}" data-view="size">How long</button>
      <button class="pill ${ideaView==='area'?'':'ghost'}" data-view="area">Area</button>
    </div>
    ${shopList()}
    ${groups.map(g=>{
      const items=S.ideas.filter(i=>!i.shop && i[field]===g.key);
      if(!items.length) return '';
      return `<h2>${g.label} · ${items.length}</h2><div class="card">`+items.map(i=>`
        <div class="idea"><p>${esc(i.text)}
          <span class="meta" style="margin-top:6px">
            <button class="pill ghost" data-size="${i.id}">${SIZES.find(s=>s.id===i.size).label}</button>
            <button class="pill warm" data-area="${i.id}">${esc(i.area)}</button>
            <button class="pill" data-habit="${i.id}">Make it a habit</button>
          </span></p>
          <button class="x" data-del="${i.id}" aria-label="Remove">×</button></div>`).join('')+'</div>';
    }).join('') || (S.ideas.length?'':'<div class="empty">Nothing here yet.</div>')}
    ${S.ideas.some(i=>!i.shop)?'<p class="hint">Tap a tag to change it if I guessed wrong.</p>':''}
  `;
  document.getElementById('addIdeas').onclick=()=>{
    const lines=document.getElementById('dump').value.split('\n').map(s=>s.replace(/^[\s\-•*\d.)]+/,'').trim()).filter(Boolean);
    if(!lines.length) return;
    let shop=0, other=0;
    lines.forEach(line=>{
      // "milk, eggs, bread" on one line becomes three shopping items
      const parts=line.split(/\s*(?:,|\band\b|&)\s*/).filter(Boolean);
      if(parts.length>1 && parts.every(isShop)) parts.forEach(p=>{ S.ideas.push({id:uid(),text:p,shop:true,added:todayKey()}); shop++; });
      else if(isShop(line)){ S.ideas.push({id:uid(),text:line,shop:true,added:todayKey()}); shop++; }
      else { S.ideas.push({id:uid(),text:line,size:guessSize(line),area:guessArea(line)}); other++; }
    });
    document.getElementById('dump').value='';
    save(); render();
    toast([shop?`${shop} to the shopping list`:'', other?`${other} idea${other>1?'s':''} sorted`:''].filter(Boolean).join(' · '));
  };
  document.querySelectorAll('[data-got]').forEach(b=>b.onclick=()=>{ const i=find(b.dataset.got); i.got=!i.got; save(); render(); });
  document.querySelectorAll('[data-notshop]').forEach(b=>b.onclick=()=>{ const i=find(b.dataset.notshop); i.shop=false; i.size=guessSize(i.text); i.area=guessArea(i.text); save(); render(); });
  const cl=document.getElementById('clearGot'); if(cl) cl.onclick=()=>{ S.ideas=S.ideas.filter(i=>!(i.shop&&i.got)); save(); render(); };
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ ideaView=b.dataset.view; render(); });
  const find=id=>S.ideas.find(i=>i.id===id);
  document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ const i=find(b.dataset.size), n=SIZES.findIndex(s=>s.id===i.size); i.size=SIZES[(n+1)%SIZES.length].id; save(); render(); });
  document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{ const i=find(b.dataset.area); i.area=AREAS[(AREAS.indexOf(i.area)+1)%AREAS.length]; save(); render(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.ideas=S.ideas.filter(i=>i.id!==b.dataset.del); save(); render(); });
  document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{
    const i=find(b.dataset.habit);
    editHabit(null,{name:i.text, area:i.area, mins:i.size==='5'?5:i.size==='30'?30:20,
      tiny:i.size==='big'?'Spend 5 minutes on the very first step':''});
    // remove idea once the habit is saved
    const btn=document.getElementById('f_save'), orig=btn.onclick;
    btn.onclick=()=>{ const before=S.habits.length; orig(); if(S.habits.length>before){ S.ideas=S.ideas.filter(x=>x.id!==i.id); save(); render(); } };
  });
}

/* ---------- start ---------- */
if(!handleCalLink()) render();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !location.hash.startsWith('#cal=')) render(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
