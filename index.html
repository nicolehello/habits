<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Habits</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --ink:#2b2d2a; --soft:#6f736c; --line:#e6e2d8;
  --accent:#6f8f72; --accent-soft:#e3ebe1; --warm:#c58b5c; --warm-soft:#f4e6da;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1d1b; --card:#242724; --ink:#e9e8e3; --soft:#a3a69f; --line:#343833;
    --accent:#93b496; --accent-soft:#2d3a2e; --warm:#d9a77d; --warm-soft:#3d3128; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-weight:600;font-size:26px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:26px 0 10px}
.sub{color:var(--soft);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:0 0 10px}
.habit{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;transition:.2s;margin-top:2px}
.tick svg{opacity:0;transition:.2s}
.tick.done{background:var(--accent);border-color:var(--accent)}
.tick.done svg{opacity:1}
.hbody{flex:1;min-width:0}
.hname{font-weight:600;margin:0}
.tiny{color:var(--soft);font-size:14px;margin:2px 0 0}
.cue{font-size:13px;color:var(--soft);margin:6px 0 0;font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{text-align:left;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:0;cursor:pointer;font-family:inherit}
.pill.warm{background:var(--warm-soft)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
.dots{display:flex;gap:5px;margin-top:10px}
.dot{width:22px;text-align:center;font-size:10px;color:var(--soft)}
.dot i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 3px;background:var(--line)}
.dot.off i{background:transparent;border:1px dashed var(--line)}
.dot.done i{background:var(--accent)}
.dot.today{color:var(--ink);font-weight:600}
.nudge{font-size:13px;color:var(--warm);margin:6px 0 0}
.empty{color:var(--soft);text-align:center;padding:24px 8px}
button.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer;width:100%;font-weight:600}
button.btn.secondary{background:var(--accent-soft);color:var(--ink)}
button.link{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0}
label{display:block;font-size:13px;color:var(--soft);margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.days{display:flex;gap:6px}
.days button{flex:1;font:inherit;font-size:13px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font:inherit;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;cursor:pointer}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea p{margin:0;flex:1}
.x{background:none;border:0;color:var(--soft);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));z-index:11;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet-inner{max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hint{font-size:13px;color:var(--soft)}
.quote{font-size:14px;color:var(--soft);font-style:italic;margin:4px 0 0}
.coach{background:var(--accent-soft);border:0}
.coach textarea{background:var(--card)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-h{font-size:11px;color:var(--soft)}
.cal-d{font:inherit;font-size:13px;aspect-ratio:1;border-radius:10px;border:0;background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
.cal-d.t{outline:2px solid var(--warm)}
.cal-d.sel{outline:2px solid var(--ink)}
.why{font-size:13px;color:var(--soft);margin:4px 0 0}
.card.slipped{border-color:var(--warm)}
.steps{margin-top:8px;font-size:14px}
.steps summary{color:var(--accent);cursor:pointer}
.steps ol{margin:6px 0 0;padding-left:20px;color:var(--ink)}
.steps li{margin:3px 0}
.timeline .tl{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.timeline .tl:last-child{border-bottom:0}
.tl-t{font-variant-numeric:tabular-nums;color:var(--soft);width:46px;font-size:14px}
.tl-n{flex:1}.tl-c{color:var(--accent);font-weight:700}
.tl.done .tl-n{color:var(--soft);text-decoration:line-through}
.burst{font-size:44px;color:var(--warm)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toggle{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--accent)}.toggle.on i{left:23px}
.grow{background:var(--warm-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<main id="app"></main>

<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Today</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Habits</button>
  <button data-tab="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const KEY = 'little-habits-v1';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const ICS_DAYS = ['MO','TU','WE','TH','FR','SA','SU'];
const AREAS = ['Studio','Home','Health','Life'];
const SIZES = [{id:'5',label:'5 min'},{id:'30',label:'~30 min'},{id:'big',label:'Bigger project'}];

function uid(){ return Math.random().toString(36).slice(2,10); }
function examples(){
  const ex=(o)=>Object.assign({id:uid(),alert:0,heads:15,done:{},created:todayKey(),example:true},o);
  return [
    ex({name:'Go to the studio', tiny:'Just arrive and open one sketchbook', cue:'After I finish work, I grab my bag and go', days:[1,5], time:'17:30', mins:20, area:'Studio', identity:'someone who makes art', why:'I feel most like me when I make things', setup:'Pack a studio bag and leave it by the door', steps:'Grab the bag by the door\nGo to the studio\nOpen one sketchbook\nKeep going if you feel like it'}),
    ex({name:'Go for a walk', tiny:'Put my shoes on and step outside', cue:'After lunch, I put my shoes on and go', days:[0,2,4], time:'12:30', mins:15, area:'Health', identity:'someone who moves every day', why:'Fresh air clears my head', pair:'Listen to a favourite podcast only while walking', setup:'Leave your shoes by the door', steps:'Put your shoes on\nStep outside\nWalk to the end of the street\nKeep going if you feel like it'}),
    ex({name:'Read before bed', tiny:'Read one page', cue:'After I get into bed, I read instead of scrolling', days:[0,1,2,3,4,5,6], time:'21:30', mins:15, area:'Life', identity:'a reader', why:'I sleep better without my phone', setup:'Put the book on your pillow each morning', steps:'Get into bed\nPut the phone on charge\nRead one page'}),
    ex({name:'Tidy for 10 minutes', tiny:'Put away 3 things', cue:'After dinner, I set a 10 minute timer and tidy', days:[0,1,2,3,4], time:'19:30', mins:10, area:'Home', identity:'someone with a calm home', why:'A tidy space makes the morning easier', setup:'Put a basket in the room you tidy most', steps:'Set a 10 minute timer\nPut away 3 things\nStop when the timer goes'}),
  ];
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.habits){
      if(!s.v2){ // add the new examples for anyone who opened the first version
        s.v2=true;
        const have=new Set(s.habits.map(h=>h.name));
        s.habits.forEach(h=>{ if(h.name==='Go to the studio' && !Object.keys(h.done).length) h.example=true; });
        examples().forEach(e=>{ if(!have.has(e.name)) s.habits.push(e); });
      }
      return s;
    }
  } catch(e){}
  return { v2:true, habits:examples(), ideas:[] };
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return keyOf(new Date()); }
function dow(d){ return (d.getDay()+6)%7; } // Mon=0
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function scheduled(h,d){ return h.days.includes(dow(d)); }

/* Forgiving streak: walk back through scheduled days.
   One miss is forgiven ("never miss twice"); two misses in a row end the run. */
function streak(h){
  let count=0, misses=0, d=new Date();
  const start = h.created ? new Date(h.created+'T00:00') : addDays(d,-365);
  // today only counts against you once it's over
  if (scheduled(h,d) && !h.done[keyOf(d)]) d=addDays(d,-1);
  for(let i=0;i<400 && d>=start;i++, d=addDays(d,-1)){
    if(!scheduled(h,d)) continue;
    if(h.done[keyOf(d)]){ count++; misses=0; }
    else { misses++; if(misses>=2) break; }
  }
  return count;
}
function missedDay(h){
  let d=addDays(new Date(),-1);
  const start = h.created ? new Date(h.created+'T00:00') : d;
  for(let i=0;i<14 && d>=start;i++, d=addDays(d,-1)){
    if(scheduled(h,d)) return h.done[keyOf(d)] ? null : d;
  }
  return null;
}
function missedLast(h){ return !!missedDay(h); }
function doneInLastWeeks(h,weeks){
  let n=0,need=0,d=new Date();
  for(let i=0;i<weeks*7;i++,d=addDays(d,-1)){ if(scheduled(h,d)){need++; if(h.done[keyOf(d)]) n++;} }
  return {n,need};
}

/* ---------- brain-dump sorter ---------- */
const AREA_WORDS = {
  Studio:/\b(art|studio|paint|painting|draw|drawing|sketch|clay|ceramic|pottery|print|canvas|photo|design|craft|sew|knit|make|create|music|guitar|piano|write|writing|poem)\w*/i,
  Home:/\b(clean|tidy|declutter|laundry|wash|dish|garden|plant|fix|repair|cook|meal|kitchen|room|house|home|shelf|cupboard|wardrobe|vacuum|bin|fridge|sort)\w*/i,
  Health:/\b(walk|run|gym|yoga|stretch|swim|bike|cycle|sleep|water|meditat|breath|exercise|workout|doctor|dentist|vitamin|eat|salad|veg|health|physio|pilates)\w*/i,
};
const BIG = /\b(project|build|learn|course|plan|redo|renovat|organi[sz]e (the|my) (whole|entire)|whole|entire|website|business|book|series|exhibition|portfolio|trip|move|apply)\w*/i;
const SMALL = /\b(text|call|email|message|reply|book|order|buy|pay|check|water the|drink|take out|put|bin|list|note|sign|send|cancel|renew|text)\w*/i;
const FOOD = /\b(milk|eggs?|bread|butter|cheese|yog(h)?urt|cream|flour|sugar|salt|pepper|oil|vinegar|rice|pasta|noodles?|oats|cereal|muesli|coffee|tea|juice|apples?|bananas?|oranges?|lemons?|limes?|berries|strawberr\w*|blueberr\w*|grapes|avocados?|kiwi\w*|tomato(es)?|potato(es)?|kumara|onions?|garlic|ginger|carrots?|broccoli|spinach|lettuce|cucumber|capsicum|peppers?|mushrooms?|courgette|zucchini|pumpkin|cabbage|celery|corn|peas|beans|lentils|chickpeas|tofu|chicken|beef|mince|pork|lamb|bacon|ham|sausages?|fish|salmon|tuna|prawns?|herbs?|basil|parsley|coriander|cumin|paprika|chocolate|biscuits?|crackers|chips|nuts|almonds|peanut butter|honey|jam|stock|soy sauce|sauce|tinned|canned|frozen|wraps|tortillas|bagels?|buns|toilet paper|loo roll|dish(washing)? liquid|detergent|soap|shampoo|toothpaste)\b/i;
function isShop(t){ return FOOD.test(t) && t.split(/\s+/).length<=5; }
function guessArea(t){ for(const a of ['Studio','Health','Home']) if(AREA_WORDS[a].test(t)) return a; return 'Life'; }
function guessSize(t){
  const m = t.match(/(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hour|hours)\b/i);
  if(m){ const mins = /^h/i.test(m[2]) ? +m[1]*60 : +m[1]; return mins<=10?'5':mins<=60?'30':'big'; }
  if(BIG.test(t)) return 'big';
  if(SMALL.test(t) || t.split(/\s+/).length<=3) return '5';
  return '30';
}


/* ---------- coach (free, rules-based) ---------- */
const PLAYBOOK = [
  {re:/studio/i, name:'Go to the studio', tiny:'Arrive and open one sketchbook', identity:'someone who makes art', cue:'After work, I grab my bag and go straight there', n:2, time:'17:30', mins:20, area:'Studio',
   tip:'Two short visits a week is plenty to start. Once it feels easy, add a day or ten minutes.'},
  {re:/\b(paint|draw|sketch|illustrat|doodle|art)\w*/i, name:'Make a little art', tiny:'Draw one line in my sketchbook', identity:'someone who makes art', cue:'After my morning coffee, I open my sketchbook', n:3, time:'08:00', mins:15, area:'Studio',
   tip:'Keep the sketchbook out where you\'ll see it. Visible cue, easy start.'},
  {re:/\b(clay|ceramic|pottery|wheel|throw)\w*/i, name:'Clay time', tiny:'Wedge one ball of clay', identity:'a potter', cue:'After lunch on the weekend, I go to the wheel', n:2, time:'13:00', mins:30, area:'Studio',
   tip:'Set out your tools the night before so starting takes seconds.'},
  {re:/\b(guitar|piano|music|sing|ukulele|practi[cs]e)\w*/i, name:'Play music', tiny:'Play one song, or just tune up', identity:'a musician', cue:'After dinner, I pick up my instrument', n:4, time:'19:30', mins:15, area:'Studio',
   tip:'Leave the instrument out of its case. Friction is the enemy.'},
  {re:/\b(write|writing|journal|poem|blog|diary)\w*/i, name:'Write', tiny:'Write one sentence', identity:'a writer', cue:'After I make my morning tea, I open my notebook', n:5, time:'07:30', mins:10, area:'Studio',
   tip:'One sentence counts. Most days you\'ll keep going.'},
  {re:/\b(read|book)\w*/i, name:'Read', tiny:'Read one page', identity:'a reader', cue:'After I get into bed, I read instead of scrolling', n:7, time:'21:30', mins:15, area:'Life',
   tip:'Put the book on your pillow in the morning so it\'s there at night.'},
  {re:/\b(walk)\w*/i, name:'Go for a walk', tiny:'Put my shoes on and step outside', identity:'someone who moves every day', cue:'After lunch, I put my shoes on and go', n:5, time:'12:30', mins:20, area:'Health',
   tip:'Shoes by the door. Just getting outside is the win.'},
  {re:/\b(run|jog)\w*/i, name:'Go for a run', tiny:'Put my running gear on', identity:'a runner', cue:'After I wake up, I put my running gear on', n:3, time:'07:00', mins:20, area:'Health',
   tip:'Lay your gear out the night before. Walk breaks are fine.'},
  {re:/\b(gym|exercise|workout|work out|fit|strength|weights)\w*/i, name:'Move my body', tiny:'Do 5 squats', identity:'someone who looks after my body', cue:'After work, I change straight into workout clothes', n:3, time:'17:30', mins:20, area:'Health',
   tip:'Showing up matters more than the workout. Five squats keeps the chain going.'},
  {re:/\b(yoga|stretch|pilates|mobility)\w*/i, name:'Stretch', tiny:'Roll out my mat and do one stretch', identity:'someone who takes care of my body', cue:'After I brush my teeth at night, I roll out my mat', n:5, time:'21:00', mins:10, area:'Health',
   tip:'Leave the mat rolled out somewhere you\'ll walk past.'},
  {re:/\b(meditat|breath|mindful|calm)\w*/i, name:'Meditate', tiny:'Take three slow breaths', identity:'a calm person', cue:'After I sit down with my morning coffee, I close my eyes', n:7, time:'07:30', mins:5, area:'Health',
   tip:'Three breaths counts. Seriously.'},
  {re:/\b(water|hydrat|drink)\w*/i, name:'Drink water', tiny:'Drink one glass', identity:'someone who looks after myself', cue:'After I wake up, I drink a glass of water', n:7, time:'07:00', mins:2, area:'Health',
   tip:'Keep a full glass by the bed.'},
  {re:/\b(sleep|bed|bedtime|wind down)\w*/i, name:'Wind down for bed', tiny:'Put my phone on charge outside the bedroom', identity:'someone who rests well', cue:'At 10pm, I plug my phone in in the kitchen', n:7, time:'22:00', mins:10, area:'Health',
   tip:'The phone leaving the room is the whole habit.'},
  {re:/\b(tidy|clean|declutter|mess|organi[sz]e|laundry|dishes|house|home)\w*/i, name:'Tidy for 10 minutes', tiny:'Put away 3 things', identity:'someone with a calm home', cue:'After dinner, I set a 10 minute timer and tidy', n:5, time:'19:30', mins:10, area:'Home',
   tip:'Stop when the timer goes, even mid-task. It keeps it light.'},
  {re:/\b(cook|meal|bake|recipe|eat)\w*/i, name:'Cook a proper meal', tiny:'Pick tonight\'s recipe in the morning', identity:'someone who cooks', cue:'After breakfast, I choose what\'s for dinner', n:3, time:'17:30', mins:30, area:'Home',
   tip:'Deciding early is half the battle. Add ingredients to your shopping list.'},
  {re:/\b(garden|plant|weed)\w*/i, name:'Garden', tiny:'Water one plant', identity:'a gardener', cue:'After my morning coffee, I step into the garden', n:3, time:'08:00', mins:15, area:'Home',
   tip:'Just going outside to look counts.'},
  {re:/\b(learn|study|language|spanish|french|maori|te reo|japanese|duolingo|course)\w*/i, name:'Learn a little', tiny:'Do one lesson or learn one word', identity:'a lifelong learner', cue:'After I sit down on the bus or with lunch, I open my lesson', n:5, time:'12:30', mins:15, area:'Life',
   tip:'Small and daily beats long and rare for learning.'},
  {re:/\b(phone|scroll|screen|social media|instagram|tiktok)\w*/i, name:'Phone-free time', tiny:'Put my phone in another room for 10 minutes', identity:'someone in charge of my attention', cue:'After I get home, my phone goes in the drawer', n:5, time:'18:00', mins:30, area:'Life',
   tip:'Out of sight really is out of mind.'},
  {re:/\b(friend|call|family|mum|mom|dad|text)\w*/i, name:'Reach out to someone', tiny:'Send one message', identity:'a good friend', cue:'After Sunday lunch, I message someone I miss', n:1, time:'14:00', mins:10, area:'Life',
   tip:'One message a week adds up to a lot of connection.'},
];
const EXTRA = {
  'Go to the studio':{setup:'Pack a studio bag and leave it by the door', steps:'Grab the bag by the door\nWalk or drive to the studio\nOpen one sketchbook\nKeep going if you feel like it'},
  'Make a little art':{setup:'Leave your sketchbook and one pen open on the table', steps:'Sit down at the table\nPick up the pen\nDraw one line\nKeep going if you feel like it'},
  'Clay time':{setup:'Set out your tools the night before', steps:'Put on your apron\nWedge one ball of clay\nSit at the wheel'},
  'Play music':{setup:'Take the instrument out of its case and leave it on a stand', steps:'Pick up the instrument\nTune it\nPlay one song'},
  'Write':{setup:'Keep a notebook and pen next to the kettle', steps:'Make tea\nOpen the notebook\nWrite one sentence'},

const DAY_SPREAD = {1:[5],2:[1,5],3:[0,2,4],4:[0,1,3,5],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};
function parseTime(t){
  let m=t.match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(m){ let h=+m[1]%12; if(/pm/i.test(m[3])) h+=12; return pad(h)+':'+(m[2]||'00'); }
  m=t.match(/\bat\s*(\d{1,2}):(\d{2})\b/); if(m) return pad(+m[1])+':'+m[2];
  if(/\bmorning|before work|wake/i.test(t)) return '07:30';
  if(/\blunch/i.test(t)) return '12:30';
  if(/\bafter work|afternoon/i.test(t)) return '17:30';
  if(/\bevening|after dinner|night/i.test(t)) return '19:30';
  return null;
}
function parseDays(t){
  const named=[]; ['mon','tue','wed','thu','fri','sat','sun'].forEach((d,i)=>{ if(new RegExp('\\b'+d,'i').test(t)) named.push(i); });
  if(named.length) return named;
  if(/\bweekends?\b/i.test(t)) return [5,6];
  if(/\bweekdays?\b/i.test(t)) return [0,1,2,3,4];
  if(/\b(every ?day|daily|each day)\b/i.test(t)) return DAY_SPREAD[7];
  const words={once:1,one:1,twice:2,two:2,three:3,four:4,five:5,six:6};
  let m=t.match(/\b(\d|once|twice|one|two|three|four|five|six)\s*(?:times?|x|days?)?\s*(?:a|per|each)\s*week/i) || t.match(/\b(once|twice)\b/i);
  if(m){ const n=words[m[1].toLowerCase()]||+m[1]; return DAY_SPREAD[Math.min(7,Math.max(1,n))]; }

}
function parseMins(t){ const m=t.match(/(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hour|hours)\b/i); return m ? (/^h/i.test(m[2])?+m[1]*60:+m[1]) : null; }

     .replace(/\b(\d|once|twice|one|two|three|four|five|six)\s*(times?|x|days?)?\s*(a|per|each)\s*week\b/gi,' ')
     .replace(/\b(every ?day|daily|on weekends?|weekdays?|at \d.*|in the (morning|evening)|after work|for \d+\s*\w+)\b/gi,' ')
     .replace(/[,.]+/g,' ').replace(/\s+/g,' ').trim();

}
function coachSuggest(text){

  const base = p ? {...p} : {name:tidyName(t)||t, tiny:'Do it for just 2 minutes', identity:'someone who keeps promises to myself',
    cue:'After breakfast, I '+(tidyName(t)||t).toLowerCase(), n:3, time:'18:00', mins:15, area:guessArea(t)==='Life'?'':guessArea(t),
    tip:'Make the first step tiny. Two minutes, then stop if you want.'};
  const days=parseDays(t)||DAY_SPREAD[base.n];
  const time=parseTime(t)||base.time;

/* ---------- calendar (.ics) ---------- */
function pad(n){return String(n).padStart(2,'0');}
function nextStart(h){

}
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsFor(h){

  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  const now=new Date(), stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';

  const days=h.days.slice().sort().map(i=>ICS_DAYS[i]).join(',');
  const alertBefore = +h.alert||0;
  return [
    'BEGIN:VEVENT','UID:'+h.id+'@little-habits','DTSTAMP:'+stamp,
    'DTSTART:'+f(d),'DTEND:'+f(e),
    'RRULE:FREQ=WEEKLY;BYDAY='+days,
    'SUMMARY:'+icsEsc(h.name),'DESCRIPTION:'+icsEsc(desc),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(alertText(h)),
    'TRIGGER:-PT'+alertBefore+'M','END:VALARM',
    ...(+h.heads ? ['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Heads up: '+h.name+' in '+h.heads+' minutes. Start finishing what you are doing.'),'TRIGGER:-PT'+(+h.heads)+'M','END:VALARM'] : []),
    'END:VEVENT'
  ].join('\r\n');
}
function alertText(h){

}
function icsDoc(list){

}

function openReview(){
  const now=new Date(), sunday = dow(now)===6 ? now : addDays(now,-1);
  const list=S.habits.filter(h=>!h.example);
  const rows=list.map(h=>{
    let n=0,need=0; for(let i=0;i<7;i++){ const d=addDays(sunday,-i); if(scheduled(h,d)){ need++; if(h.done[keyOf(d)]) n++; } }
    return `<div class="card" data-rv="${h.id}"><p class="hname">${esc(h.name)}</p><p class="tiny">${n} of ${need} this week</p>
      <div class="days" style="margin-top:10px">${['Too hard','About right','Too easy'].map((l,i)=>`<button type="button" data-feel="${i}">${l}</button>`).join('')}</div>
      <p class="hint rv-sug" style="margin:8px 0 0"></p></div>`;
  }).join('');
  openSheet(`<h1 style="font-size:22px">Sunday check-in</h1>
    <p class="sub">How did each habit feel this week? I'll suggest a tweak. Not too hard, not too easy: just right keeps you going.</p>
    ${rows||'<div class="empty">Add a habit of your own first.</div>'}
    <label>What helped, or what got in the way? (optional)</label><textarea id="rv_note" style="min-height:70px"></textarea>
    <div style="height:14px"></div><button class="btn" id="rv_save">Save check-in</button>`, ()=>{
    const feel={};
    document.querySelectorAll('[data-rv]').forEach(card=>{
      const h=S.habits.find(x=>x.id===card.dataset.rv);
      card.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{
        card.querySelectorAll('[data-feel]').forEach(x=>x.classList.toggle('on',x===b));
        feel[h.id]=+b.dataset.feel;
        card.querySelector('.rv-sug').textContent=suggestTweak(h,+b.dataset.feel).text;
      });
    });
    document.getElementById('rv_save').onclick=()=>{
      const changes=[];
      Object.entries(feel).forEach(([id,f])=>{ const h=S.habits.find(x=>x.id===id); const t=suggestTweak(h,f); if(t.apply){ t.apply(); changes.push(h.name); } });
      (S.reviews=S.reviews||[]).push({week:keyOf(sunday),date:todayKey(),feel,note:document.getElementById('rv_note').value.trim()});
      save(); closeSheet(); render();
      toast(changes.length?'Updated: '+changes.join(', ')+'. Re-add to Calendar if times changed.':'Check-in saved. See you next Sunday.');
    };
  });
}
function suggestTweak(h,feel){
  const {n,need}=doneInLastWeeks(h,3);
  if(feel===0){
    if(h.days.length>2){ const drop=h.days[h.days.length-1]; return {text:`Let's drop ${DAYS[drop]} so it's ${h.days.length-1} days a week. Easier wins.`, apply:()=>{ h.days=h.days.filter(d=>d!==drop); }}; }
    if((h.mins||15)>5){ const m=Math.max(2,Math.round((h.mins||15)/2)); return {text:`Let's halve it to ${m} minutes. Showing up matters more than how long.`, apply:()=>{ h.mins=m; }}; }
    return {text:'It\'s already tiny. Try a different cue or time, tap Edit on it in Habits.'};
  }
  if(feel===2){
    if(need>=4 && n/need>=0.8){
      if(h.days.length<7){ const add=[0,1,2,3,4,5,6].find(d=>!h.days.includes(d) && !h.days.includes((d+6)%7)) ?? [0,1,2,3,4,5,6].find(d=>!h.days.includes(d));
        return {text:`You've been consistent for 3 weeks. Let's add ${DAYS[add]}.`, apply:()=>{ h.days=[...h.days,add].sort(); }}; }
      return {text:`Consistent for 3 weeks! Let's add 5 minutes.`, apply:()=>{ h.mins=(h.mins||15)+5; }};
    }
    return {text:'Nice. Keep it the same until it\'s been easy for 3 weeks, then we\'ll grow it.'};
  }
  return {text:'Perfect. Keep it just as it is.'};
}

function exportData(){

  if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); }

function importData(e){
  const file=e.target.files[0]; if(!file) return;
  file.text().then(t=>{ const d=JSON.parse(t); if(!d.habits) throw 0; if(confirm('Replace everything here with this backup?')){ S=d; S.ideas=S.ideas||[]; save(); render(); toast('Restored'); } })
    .catch(()=>toast('That file didn\'t look like a backup'));
}

    const i=find(b.dataset.habit);
    editHabit(null,{coach:i.text, area:i.area});
    // remove idea once the habit is saved
    const btn=document.getElementById('f_save'), orig=btn.onclick;
    btn.onclick=()=>{ const before=S.habits.length; orig(); if(S.habits.length>before){ S.ideas=S.ideas.filter(x=>x.id!==i.id); save(); render(); } };
  });
}


/* ---------- History ---------- */
let histMonth=null, histDay=null;
function bestStreak(h){
  let best=0,cur=0,misses=0,d=new Date((h.created||todayKey())+'T00:00');
  const firstDone=Object.keys(h.done).sort()[0]; if(firstDone && new Date(firstDone+'T00:00')<d) d=new Date(firstDone+'T00:00');
  const end=new Date();
  for(;d<=end;d=addDays(d,1)){
    if(!scheduled(h,d)) continue;
    const k=keyOf(d);
    if(h.done[k]){ cur++; misses=0; best=Math.max(best,cur); }
    else if(k!==todayKey()){ misses++; if(misses>=2){ cur=0; } }
  }
  return best;
}
function renderHistory(){
  const all=[...S.habits,...(S.archived||[])], log=S.log||[];
  const now=new Date(); if(!histMonth) histMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const y=histMonth.getFullYear(), m=histMonth.getMonth();
  const byDay={}; all.forEach(h=>Object.keys(h.done).forEach(k=>{ (byDay[k]=byDay[k]||[]).push(h.name); }));
  log.forEach(l=>{ (byDay[l.date]=byDay[l.date]||[]).push(l.text); });
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate(), offset=dow(first);
  let cells=''; for(let i=0;i<offset;i++) cells+='<div></div>';
  for(let d=1;d<=daysIn;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d), n=(byDay[k]||[]).length, isT=k===todayKey(), sel=k===histDay;
    const bg = n? `background:color-mix(in srgb, var(--accent) ${Math.min(100,30+n*25)}%, transparent);color:#fff` : '';
    cells+=`<button class="cal-d ${isT?'t':''} ${sel?'sel':''}" data-day="${k}" style="${bg}">${d}</button>`;
  }
  const monthTicks=Object.keys(byDay).filter(k=>k.startsWith(y+'-'+pad(m+1))).reduce((a,k)=>a+byDay[k].length,0);
  const total=Object.values(byDay).reduce((a,v)=>a+v.length,0);
  const dayList = histDay ? `<div class="card"><p class="hname">${new Date(histDay+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p>`+
     ((byDay[histDay]||[]).map(t=>`<p class="tiny">✓ ${esc(t)}</p>`).join('')||'<p class="tiny">Nothing ticked. That\'s okay.</p>')+'</div>' : '';
  document.getElementById('app').innerHTML=`
    <h1>History</h1>
    <p class="sub">${total} things done since you started. Every one a vote for who you're becoming.</p>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <button class="link" id="prevM" aria-label="Previous month">‹ Prev</button>
        <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
        <button class="link" id="nextM" aria-label="Next month">Next ›</button>
      </div>
      <div class="cal">${DAYS.map(d=>`<div class="cal-h">${d[0]}</div>`).join('')}${cells}</div>
      <p class="hint" style="margin:10px 0 0">${monthTicks} done this month. Tap a day to see what you did.</p>
    </div>
    ${dayList}
    <h2>Habits</h2>
    ${all.map(h=>{ const t=Object.keys(h.done).length; return `<div class="card"><p class="hname">${esc(h.name)}${h.archivedOn?' <span class="hint">(retired)</span>':''}</p>
      <div class="meta"><span class="pill">${t} time${t===1?'':'s'} total</span><span class="pill warm">Best run: ${bestStreak(h)}</span>${h.archivedOn?'':`<span class="pill ghost">Now: ${streak(h)}</span>`}</div></div>`; }).join('')||'<div class="empty">No habits yet.</div>'}
    ${(S.reviews||[]).length?`<h2>Sunday check-ins</h2><div class="card">${S.reviews.slice().reverse().map(r=>`<div class="idea"><p><b>${new Date(r.week+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</b>${r.note?' · '+esc(r.note):''}<br><span class="hint">${Object.entries(r.feel||{}).map(([id,f])=>{const h=all.find(x=>x.id===id);return h?esc(h.name)+': '+['too hard','about right','too easy'][f]:''}).filter(Boolean).join(' · ')}</span></p></div>`).join('')}</div>`:''}
    ${log.length?`<h2>Ideas you did</h2><div class="card">${log.slice().reverse().map(l=>`<div class="idea"><p>${esc(l.text)}</p><span class="hint">${new Date(l.date+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span></div>`).join('')}</div>`:''}
  `;
  document.getElementById('prevM').onclick=()=>{ histMonth=new Date(y,m-1,1); histDay=null; render(); };
  document.getElementById('nextM').onclick=()=>{ histMonth=new Date(y,m+1,1); histDay=null; render(); };
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ histDay=histDay===b.dataset.day?null:b.dataset.day; render(); });
}

/* ---------- start ---------- */
if(!handleCalLink()) render();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !location.hash.startsWith('#cal=')) render(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
